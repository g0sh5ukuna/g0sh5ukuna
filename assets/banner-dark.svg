<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Josué SOUNON · Consultant DevSecOps freelance</title>
  <desc id="desc">Audit applicatif, CI/CD sécurisé, hardening, conformité APDP et RGPD. Fondateur de Gonruwa Technologie, Abomey-Calavi / Cotonou, Bénin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .row, .gate { opacity: 0; animation: show .4s ease-out forwards; }
      .gate { animation-delay: 2.1s; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .pulse { transform-origin: 84px 71px; animation: pulse 2.4s ease-out infinite; }
      @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.6); } }
      @media (prefers-reduced-motion: reduce) {
        .row, .gate { opacity: 1; animation: none; }
        .cursor, .pulse { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect x="620" y="0" width="580" height="340" fill="url(#dots)" opacity="0.7"/>
    <ellipse cx="930" cy="170" rx="330" ry="210" fill="url(#glow)"/>
    <rect x="0" y="336" width="1200" height="4" fill="url(#rule)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#30363d"/>

  <!-- Identité -->
  <g class="sans">
    <rect x="64" y="56" width="252" height="30" rx="15" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.45"/>
    <circle class="pulse" cx="84" cy="71" r="5" fill="#3fb950"/>
    <circle cx="84" cy="71" r="5" fill="#3fb950"/>
    <text class="mono" x="98" y="75.5" font-size="12.5" font-weight="600" letter-spacing="1" fill="#3fb950">DISPONIBLE POUR MISSIONS</text>

    <text x="62" y="150" font-size="58" font-weight="700" letter-spacing="-1" fill="#e6edf3">Josué SOUNON</text>
    <text x="64" y="194" font-size="25" font-weight="600" fill="#2f81f7">Consultant DevSecOps freelance</text>
    <text x="64" y="232" font-size="17" fill="#8b949e">Audit · CI/CD sécurisé · Hardening · Conformité APDP &amp; RGPD</text>

    <line x1="64" y1="258" x2="600" y2="258" stroke="#30363d"/>
    <text x="64" y="289" font-size="15" fill="#8b949e">Fondateur de <tspan font-weight="600" fill="#e6edf3">Gonruwa Technologie</tspan>  ·  Abomey-Calavi / Cotonou, Bénin</text>
  </g>

  <!-- Terminal : le pipeline shift-left -->
  <g class="mono" font-size="15">
    <rect x="700" y="40" width="452" height="260" rx="12" fill="#0d1117" stroke="#30363d" stroke-opacity="1"/>
    <path d="M712 40 h428 a12 12 0 0 1 12 12 v24 h-452 v-24 a12 12 0 0 1 12 -12 z" fill="#161b22"/>
    <line x1="700" y1="76" x2="1152" y2="76" stroke="#30363d"/>
    <circle cx="724" cy="58" r="6" fill="#ff5f57"/>
    <circle cx="744" cy="58" r="6" fill="#febc2e"/>
    <circle cx="764" cy="58" r="6" fill="#28c840"/>
    <text x="926" y="63" font-size="13" fill="#8b949e" text-anchor="middle">security-gate</text>

    <text x="724" y="104"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> ./security-gate.sh</tspan></text>
    
    <g class="row" style="animation-delay:0.50s">
      <text x="740" y="134" fill="#58a6ff">sast</text>
      <text x="828" y="134" fill="#e6edf3">semgrep · bandit</text>
      <text x="1124" y="134" fill="#3fb950" text-anchor="end">✓</text>
    </g>
    <g class="row" style="animation-delay:0.85s">
      <text x="740" y="162" fill="#58a6ff">sca</text>
      <text x="828" y="162" fill="#e6edf3">trivy · osv-scanner</text>
      <text x="1124" y="162" fill="#3fb950" text-anchor="end">✓</text>
    </g>
    <g class="row" style="animation-delay:1.20s">
      <text x="740" y="190" fill="#58a6ff">secrets</text>
      <text x="828" y="190" fill="#e6edf3">gitleaks · trufflehog</text>
      <text x="1124" y="190" fill="#3fb950" text-anchor="end">✓</text>
    </g>
    <g class="row" style="animation-delay:1.55s">
      <text x="740" y="218" fill="#58a6ff">iac</text>
      <text x="828" y="218" fill="#e6edf3">checkov</text>
      <text x="1124" y="218" fill="#3fb950" text-anchor="end">✓</text>
    </g>
    <g class="gate">
      <text x="740" y="250" fill="#d29922">gate</text>
      <text x="828" y="250" fill="#e6edf3">sévérité ≥ high → merge bloqué</text>
    </g>
    <text x="724" y="280"><tspan fill="#3fb950">$</tspan><tspan class="cursor" fill="#e6edf3"> ▍</tspan></text>
  </g>
</svg>
